<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Рабочее место ИИ</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <span id="status-dot" class="status-dot pending"></span>
          <div>
            <strong>Рабочее место ИИ</strong>
            <span id="status-text">Подключаю локальную модель…</span>
          </div>
        </div>
        <button id="safety-toggle" class="quiet danger" type="button">Стоп</button>
      </header>

      <section class="composer" aria-labelledby="task-title">
        <div class="target-row">
          <label id="task-title" for="window-select">Где работать</label>
          <select id="window-select" aria-label="Программа для работы">
            <option value="">Ищу открытые программы…</option>
          </select>
        </div>
        <textarea id="task-input" rows="4" maxlength="4000" placeholder="Напишите, что нужно сделать…"></textarea>
        <button id="task-button" class="primary" type="button" disabled>Подготовить первый шаг</button>
        <p id="task-status" class="hint">Выберите программу и опишите результат.</p>
      </section>

      <section id="step-card" class="step-card" hidden aria-live="polite">
        <span id="step-number" class="step-number">Шаг 1</span>
        <h1 id="step-reason">Следующий шаг</h1>
        <p id="step-action" class="action-line"></p>
        <p id="step-result" class="expected"></p>
        <button id="execute-button" class="primary" type="button">Выполнить этот шаг</button>
      </section>

      <section id="feedback-card" class="feedback-card" hidden aria-live="polite">
        <div>
          <strong id="feedback-title">Шаг выполнен</strong>
          <p id="feedback-detail">Если всё правильно, научите модель этим примером.</p>
        </div>
        <div class="rating-buttons" aria-label="Оцените результат шага">
          <button id="positive-button" class="rating positive" type="button" aria-label="Результат правильный">👍</button>
          <button id="negative-button" class="rating negative" type="button" aria-label="Результат неправильный">👎</button>
        </div>
      </section>

      <section id="demo-panel" class="demo-panel" aria-live="polite">
        <div class="demo-heading">
          <div>
            <strong id="demo-title">Модель не поняла?</strong>
            <span id="demo-status">Покажите выполнение сами — действия станут новым опытом.</span>
          </div>
          <button id="demo-button" class="demo-button" type="button" disabled>Демонстрация</button>
        </div>

        <div id="demo-live" class="demo-live" hidden>
          <div class="trace-wrap">
            <canvas id="trace-canvas" aria-label="Траектория демонстрации"></canvas>
            <span id="event-count" class="event-count">0 действий</span>
          </div>
          <div id="keys" class="keys" aria-label="Нажатые клавиши">
            <span class="key-placeholder">Нажатые клавиши появятся здесь</span>
          </div>
        </div>
        <button id="demo-run-button" class="primary demo-run" type="button" hidden>Выполнить с учётом показа</button>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
